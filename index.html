  groups = {"พลังแห่งวิสัยทัศน์ (Visionary Power)": {"color": "#6f42c1", "ink": "white", "definition": "คือพลังที่ตอบคำถามที่สำคัญที่สุดว่า 'เรากำลังจะไปที่ไหน และทำไมที่นั่นจึงสำคัญ' พลังนี้ไม่ได้มองแค่ปัจจุบัน แต่คือการวาดภาพอนาคตที่น่าตื่นเต้นและชัดเจนจนจับต้องได้ พร้อมทั้งวางแผนที่เชิงกลยุทธ์เสมือนเป็น 'เข็มทิศ' ที่เที่ยงตรง เพื่อให้แน่ใจว่าทุกย่างก้าวของการทำงานมีความหมายและมุ่งไปสู่จุดหมายเดียวกัน"}, "พลังแห่งการสร้างสรรค์ (Creative Power)": {"color": "#ffc107", "ink": "#212529", "definition": "คือพลังที่กล้าตั้งคำถามกับสิ่งที่เป็นอยู่ว่า 'แล้วถ้ามีวิธีที่ดีกว่านี้ล่ะ?' พลังนี้คือการท้าทายความจำเจและคิดนอกกรอบ เปรียบเสมือน 'หลอดไฟ' ที่ส่องสว่างขึ้นมาในความมืด มันคือการจุดประกายไอเดียใหม่ๆ, ค้นพบทางออกที่ไม่เคยมีใครเห็น, และผลักดันให้เกิดนวัตกรรมที่สร้างความแตกต่างและนำพาองค์กรไปสู่การเติบโตที่ก้าวกระโดด"}, "พลังแห่งการขับเคลื่อน (Driving Power)": {"color": "#dc3545", "ink": "white", "definition": "คือพลังที่เปลี่ยนวิสัยทัศน์ให้กลายเป็นความจริง มันคือแรงขับเคลื่อนที่ไม่เคยหยุดนิ่งซึ่งถามว่า 'เราจะทำให้มันเกิดขึ้นได้อย่างไร และเมื่อไหร่?' พลังนี้เปรียบเสมือน 'เครื่องยนต์' ที่ทรงพลังซึ่งแปลงแผนการที่สวยหรูให้กลายเป็นผลลัพธ์ที่จับต้องได้ มันคือการลงมือทำ, การจัดการอย่างมีประสิทธิภาพ, และความมุ่งมั่นที่จะผลักดันงานให้สำเร็จลุล่วง"}, "พลังแห่งการเชื่อมโยง (Connecting Power)": {"color": "#007bff", "ink": "white", "definition": "คือพลังที่สร้าง 'ความร่วมมือ' ให้เกิดขึ้นอย่างแท้จริง มันตอบคำถามว่า 'เราจะทำงานร่วมกันให้ดีที่สุดได้อย่างไร?' พลังนี้เปรียบเสมือน 'เครือข่ายอินเทอร์เน็ต' ที่เชื่อมโยงทุกคนเข้าไว้ด้วยกัน ทำให้เกิดการสื่อสารที่ไร้รอยต่อ, ความเข้าอกเข้าใจ, และความไว้วางใจ ซึ่งเป็นรากฐานสำคัญในการสร้างทีมที่แข็งแกร่งและวัฒนธรรมองค์กรที่ยอดเยี่ยม"}, "พลังแห่งคุณธรรม (Integrity Power)": {"color": "#737171e7", "ink": "white", "definition": "คือพลังที่เป็นแกนหลักทางจริยธรรมซึ่งคอยถามว่า 'สิ่งที่เรากำลังทำนั้นถูกต้องหรือไม่?' พลังนี้เปรียบเสมือน 'ตราชั่ง' ที่เที่ยงตรง คอยสร้างความสมดุลระหว่างผลประโยชน์กับหลักการ มันคือความซื่อสัตย์, ความรับผิดชอบ, และความเป็นธรรมที่สร้างความไว้วางใจจากทั้งภายในและภายนอกองค์กร ทำให้ความสำเร็จนั้นยั่งยืนและน่าภาคภูมิใจ"}, "พลังแห่งการยืนหยัด (Resilient Power)": {"color": "#28a745", "ink": "white", "definition": "คือพลังที่แสดงศักยภาพสูงสุดในยามวิกฤต มันคือคำตอบของคำถามที่ว่า 'เมื่อเราล้มลง เราจะลุกขึ้นสู้อย่างไร?' พลังนี้เปรียบเสมือน 'ต้นหลิว' ที่สามารถโอนอ่อนผ่อนตามพายุแต่ไม่เคยหักโค่น มันคือความสามารถในการปรับตัว, การฟื้นตัวจากความล้มเหลว, และการรักษาความสงบภายใต้แรงกดดัน เพื่อให้องค์กรสามารถผ่านพ้นทุกอุปสรรคและกลับมาแข็งแกร่งกว่าเดิม"}};
  const db = store.getFirestore(sdk.getApps()[0] || sdk.initializeApp(firebaseConfig));
  const snapshot = await store.getDocs(store.collection(db,'assessments'));
  records = snapshot.docs.map(doc => {
   const d=doc.data();
   return {emails:[d.email,d.employeeEmail,d.emailAddress].map(normalize).filter(Boolean),
    name:d.employeeName || '', nickname:d.nickname || d.nickName || d.employeeNickname || d.employeeNickName || '',
    group:d.dominantGroup || '', top5:Array.isArray(d.top5)?d.top5.filter(v=>typeof v==='string').slice(0,5):[],
    time:d.timestamp?.toMillis?.() || Date.parse(d.timestamp) || 0};
  }).sort((a,b)=>b.time-a.time);
  submit.disabled=false;
 } catch(error) {
  el('notice').textContent=error.code==='permission-denied'?'Firestore ยังไม่อนุญาตให้หน้านี้อ่านผลประเมิน':'โหลดข้อมูลไม่สำเร็จ · '+(error.code || error.message);
  el('retry').hidden=false;
 } finally {el('loading').hidden=true}
}
el('retry').onclick=preload;
document.querySelector('form').onsubmit=event=>{
 event.preventDefault();
 const email=normalize(el('email').value);
 results=records.filter(row=>row.emails.includes(email));
 el('notice').textContent='';
  if(!results.length){el('notice').textContent='ไม่พบผลประเมิน กรุณาตรวจสอบอีเมลที่ใช้ตอบแบบประเมิน';return}
  el('history').replaceChildren(...results.map((r,i)=>new Option(formatDate(r.time)+' · ครั้งที่ '+(results.length-i),i)));
  el('history').hidden=results.length<2;show(0);
  el('entry').hidden=true;el('result').hidden=false;window.scrollTo(0,0);
};
preload();
el('history').onchange=()=>show(Number(el('history').value));
el('back').onclick=()=>{el('result').hidden=true;el('entry').hidden=false;el('email').focus()};
el('pdf').onclick=async()=>{try{await downloadReport(current,groups[current.group],formatDate(current.time))}catch{el('message').textContent='สร้าง PDF ไม่สำเร็จ กรุณาลองอีกครั้ง'}};
